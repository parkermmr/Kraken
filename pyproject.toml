[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "Kraken"
version = "0.1.0"
description = "A simple, lightweight, and extensible Python package for exporting, transforming, and loading Confluence pages into markdown."
authors = ["Parker Rennie"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
flake8 = "^7.1.2"
isort = "^6.0.1"

[tool.poetry.group.dev.dependencies]
python = ">=3.9,<4.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.21.0"
flake8 = "^7.1.2"
black = "^25.1.0"
simpleeval = ">=0.9.11"
python-json-logger = "^2.0.7"
mkdocs = "^1.6.1"
mistune = ">=0.8,<0.84"
pyyaml = "^6.0.2"
